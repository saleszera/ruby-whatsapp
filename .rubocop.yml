inherit_gem:
  rubocop-basic: rubocop.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

# Most classes are small nested value objects whose purpose is clear from their
# name and the source-doc link on the message class; a doc comment on every one
# is noise. Message classes still carry descriptive comments by convention.
Style/Documentation:
  Enabled: false

# The interactive value objects inherit Interactive::Base, which holds no
# instance state, so there is nothing for a parent initialize to set up.
Lint/MissingSuper:
  Enabled: false

# `Media#delete` mirrors the REST verb and returns a success boolean; it is not
# a predicate query.
Naming/PredicateMethod:
  AllowedMethods:
    - delete
